spring.application.name=partiturae

spring.datasource.url=jdbc:mysql://localhost:3307/partiturae
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# Separazione dei dati per banda: Hibernate chiede a questa classe in quale banda si sta lavorando
spring.jpa.properties.hibernate.tenant_identifier_resolver=com.grassi.partiturae.banda.BandaTenantResolver

server.forward-headers-strategy=framework
server.port=9000

app.upload-dir=./uploads
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=50MB

# --- Sicurezza (login) ---
# Chiave per firmare i token: in produzione imposta la variabile PARTITURAE_JWT_SECRET (almeno 32 caratteri).
# Se manca, in sviluppo se ne genera una casuale a ogni avvio (le sessioni si rinnovano da sole).
app.security.jwt-secret=${PARTITURAE_JWT_SECRET:}
app.security.access-token-minutes=15
app.security.refresh-token-days=7
# true quando il sito è servito in HTTPS
app.security.cookie-secure=false
app.security.allowed-origins=http://localhost:4200
# Nome della prima banda, creata al primo avvio
app.security.initial-band-name=La mia banda
app.security.admin-email=admin@partiturae.local
# Password del primo amministratore. Se vuota viene generata e scritta una volta sola nel log.
app.security.admin-password=${PARTITURAE_ADMIN_PASSWORD:}
app.security.max-failed-attempts=5
app.security.lock-minutes=15

# --- Dati di prova (SOLO sviluppo) ---
# Con PARTITURAE_DEMO=true il backend crea all'avvio un account per ogni ruolo, una seconda banda e qualche partitura.
# Non parte mai con app.security.cookie-secure=true. Tutti gli account di prova hanno la stessa password.
app.demo.enabled=${PARTITURAE_DEMO:false}
app.demo.password=${PARTITURAE_DEMO_PASSWORD:Prova-2026}