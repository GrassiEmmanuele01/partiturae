<div class="page-header">
  <h2>{{ raccoltaId() ? 'Modifica raccolta' : 'Nuova raccolta' }}</h2>
</div>

@if (loading()) {
  <p>Caricamento...</p>
} @else {
  <form [formGroup]="form" (ngSubmit)="submit()">
    <div class="field">
      <label for="nome">Nome</label>
      <input id="nome" type="text" formControlName="nome" placeholder="es. Raccolta 2026">
      @if (form.controls.nome.invalid && form.controls.nome.touched) {
        <span class="field-error">Il nome è obbligatorio</span>
      }
    </div>

    <div class="field">
      <label for="anno">Anno</label>
      <input id="anno" type="number" formControlName="anno">
    </div>

    <div class="field">
      <label for="descrizione">Descrizione</label>
      <textarea id="descrizione" formControlName="descrizione" rows="3"></textarea>
    </div>

    @if (error()) {
      <p class="error">{{ error() }}</p>
    }

    <div class="form-actions">
      <button type="submit" [disabled]="saving()">{{ saving() ? 'Salvataggio...' : 'Salva' }}</button>
      <a routerLink="/raccolte" class="btn-secondary">Annulla</a>
    </div>
  </form>
}
