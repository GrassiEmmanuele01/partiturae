<div class="page-header">
  <h2>{{ famigliaId() ? 'Modifica famiglia' : 'Nuova famiglia' }}</h2>
</div>

@if (loading()) {
  <p>Caricamento...</p>
} @else {
  <form [formGroup]="form" (ngSubmit)="submit()">
    <div class="field">
      <label for="nome">Nome</label>
      <input id="nome" type="text" formControlName="nome">
      @if (form.controls.nome.invalid && form.controls.nome.touched) {
        <span class="field-error">Il nome è obbligatorio</span>
      }
    </div>

    @if (error()) {
      <p class="error">{{ error() }}</p>
    }

    <div class="form-actions">
      <button type="submit" [disabled]="saving()">{{ saving() ? 'Salvataggio...' : 'Salva' }}</button>
      <a routerLink="/famiglie" class="btn-secondary">Annulla</a>
    </div>
  </form>
}
