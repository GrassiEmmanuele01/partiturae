<div class="page-header">
  <h2>{{ autoreId() ? 'Modifica autore' : 'Nuovo autore' }}</h2>
</div>

@if (loading()) {
  <p>Caricamento...</p>
} @else {
  <form [formGroup]="form" (ngSubmit)="submit()">
    <div class="field">
      <label for="nominativo">Nominativo</label>
      <input id="nominativo" type="text" formControlName="nominativo">
      @if (form.controls.nominativo.invalid && form.controls.nominativo.touched) {
        <span class="field-error">Il nominativo è obbligatorio</span>
      }
    </div>

    @if (error()) {
      <p class="error">{{ error() }}</p>
    }

    <div class="form-actions">
      <button type="submit" [disabled]="saving()">{{ saving() ? 'Salvataggio...' : 'Salva' }}</button>
      <a routerLink="/autori" class="btn-secondary">Annulla</a>
    </div>
  </form>
}
