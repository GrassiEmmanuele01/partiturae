<div class="layout">
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-mark">♪</span>
      <span class="brand-name">Partiturae</span>
    </div>

    <nav>
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Home</a>
      <a routerLink="/partiture" routerLinkActive="active">Partiture</a>
      <a routerLink="/raccolte" routerLinkActive="active">Raccolte</a>
      <a routerLink="/strumenti" routerLinkActive="active">Strumenti</a>

      <div class="nav-group">
        <button type="button" class="nav-group-toggle" [class.open]="formazioneMenuOpen()" (click)="toggleFormazioneMenu()">
          <span>Formazione</span>
          <span class="chevron">&rsaquo;</span>
        </button>

        @if (formazioneMenuOpen()) {
          <div class="nav-group-items">
            <a routerLink="/soci" routerLinkActive="active">Libro soci</a>
            <a routerLink="/formazione" routerLinkActive="active">Direttivo</a>
          </div>
        }
      </div>

      <a routerLink="/impostazioni" routerLinkActive="active">Impostazioni</a>
    </nav>
  </aside>

  <main class="content">
    <router-outlet></router-outlet>
  </main>
</div>
